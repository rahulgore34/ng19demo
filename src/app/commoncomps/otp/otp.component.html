<ng-container>
  <h2 class="text-2xl font-bold text-center mb-4">Verify OTP child {{otplength()}}</h2>
  <div style="display: flex;">
    @for (item of generatedArray(); track $index) {
    <div style="margin-right: 8px;">
      <input type="text" [value]="item.value" style="width: 50px;padding-left: 10px;"
        class="border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        (input)="onInput($event, $index)"
        #otpinputs>
    </div>
    }
  </div>
  <button class="w-full bg-blue-500 text-white py-1 rounded-lg hover:bg-blue-600 disabled:bg-blue-300 transition"
  [disabled]="otpStr.length < 4"
  (click)="getOTP()">Verify</button>

</ng-container>
